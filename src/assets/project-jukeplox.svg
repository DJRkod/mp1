<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Terminal window showing the Jukeplox party jukebox server starting up">
  <rect width="800" height="500" rx="14" fill="#06090e" stroke="#22314d" stroke-width="2"/>
  <rect width="800" height="46" rx="14" fill="#111c30"/>
  <rect y="32" width="800" height="14" fill="#111c30"/>
  <circle cx="28" cy="23" r="7" fill="#ff5f05"/>
  <circle cx="52" cy="23" r="7" fill="#3a4a68"/>
  <circle cx="76" cy="23" r="7" fill="#3a4a68"/>
  <text x="400" y="29" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9aa6b8">jukeplox -- python</text>
  <g font-family="Consolas, Menlo, monospace" font-size="19">
    <text x="36" y="96" fill="#ff5f05">$ <tspan fill="#e6e9ef">python -m jukeplox serve</tspan></text>
    <text x="36" y="136" fill="#9aa6b8">[plex]   connected to library "Music"</text>
    <text x="36" y="170" fill="#9aa6b8">[cast]   found 3 outputs: Chromecast, AirPlay, DLNA</text>
    <text x="36" y="204" fill="#9aa6b8">[web]    guest queue at http://jukebox.local:8080</text>
    <text x="36" y="252" fill="#e6e9ef">now playing  <tspan fill="#ff5f05">Mr. Blue Sky</tspan>  - ELO</text>
    <text x="36" y="286" fill="#9aa6b8">up next      September - Earth, Wind and Fire</text>
    <text x="36" y="320" fill="#9aa6b8">             Dreams - Fleetwood Mac</text>
    <text x="36" y="368" fill="#9aa6b8">[queue]  guest "sam" added 1 track (4 waiting)</text>
  </g>
  <g fill="#ff5f05">
    <rect x="36" y="410" width="10" height="46" rx="2"/>
    <rect x="54" y="424" width="10" height="32" rx="2"/>
    <rect x="72" y="398" width="10" height="58" rx="2"/>
    <rect x="90" y="432" width="10" height="24" rx="2"/>
    <rect x="108" y="416" width="10" height="40" rx="2"/>
    <rect x="126" y="404" width="10" height="52" rx="2"/>
    <rect x="144" y="428" width="10" height="28" rx="2"/>
  </g>
  <rect x="176" y="438" width="12" height="20" fill="#e6e9ef"/>
</svg>
